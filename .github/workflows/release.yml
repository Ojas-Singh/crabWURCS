name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc
      - run: ./scripts/check_release.sh "${GITHUB_REF_NAME#v}"

  wheels:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64
            compatibility: "2_17"
          - os: ubuntu-24.04-arm
            target: aarch64
            compatibility: "2_17"
          - os: macos-13
            target: x86_64
            compatibility: "off"
          - os: macos-14
            target: aarch64
            compatibility: "off"
          - os: windows-2022
            target: x64
            compatibility: "off"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.compatibility }}
          command: build
          args: --release --locked --compatibility pypi --out dist
      - name: Install and test wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl pytest
          python -m pytest
          crabwurcs --version
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-rust:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          crates=(crabwurcs-core crabwurcs-iupac crabwurcs-mol crabwurcs-pdb crabwurcs-snfg crabwurcs crabwurcs-cli)
          for crate in "${crates[@]}"; do
            if curl --fail --silent "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null; then
              echo "${crate} ${version} is already published"
              continue
            fi
            cargo publish -p "${crate}" --locked
            for attempt in {1..30}; do
              curl --fail --silent "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null && break
              sleep 10
            done
            curl --fail --silent "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null
          done

  publish-python:
    needs: [wheels, sdist, publish-rust]
    runs-on: ubuntu-22.04
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheel-*"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    needs: [publish-rust, publish-python]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheel-*"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
